<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄时钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        :root {
            /* 亮色模式变量 */
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-color: #333333;
            --secondary-text: #777777;
            --working-color: #4CAF50;
            --working-bg-light: rgba(76, 175, 80, 0.1);
            --working-bg-dark: rgba(76, 175, 80, 0.3);
            --rest-color: #2196F3;
            --rest-bg: rgba(33, 150, 243, 0.05);
            --long-rest-color: #3F51B5;
            --long-rest-bg: rgba(63, 81, 181, 0.1);
            --btn-bg: #4CAF50;
            --btn-text: white;
            --stat-bg: #f5f5f5;
            --header-border: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --cancel-btn-bg: #f44336;
            --input-border: #e0e0e0;
            --settings-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --working-bg-dark: #1a2a1a;
            --working-bg-light: #2a3b2a;
            --rest-bg: #1a2a3b;
            --long-rest-bg: #2a1a3b;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --secondary-text: #9e9e9e;
            --working-color: #66BB6A;
            --rest-color: #64B5F6;
            --long-rest-color: #9575CD;
            --btn-bg: #66BB6A;
            --btn-text: white;
            --stat-bg: #2d2d2d;
            --header-border: #424242;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --cancel-btn-bg: #E57373;
            --input-border: #424242;
            --settings-bg: #1e1e1e;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        body.no-scroll {
            overflow: hidden;
        }

        body.working {
            background-color: var(--working-bg-dark);
        }

        body.working.paused {
            background-color: var(--working-bg-light);
        }

        body.rest {
            background-color: var(--rest-bg);
        }

        body.working[data-theme="dark"] {
            background-color: var(--working-bg-dark);
        }

        body.working.paused[data-theme="dark"] {
            background-color: var(--working-bg-light);
        }

        body.rest[data-theme="dark"] {
            background-color: var(--rest-bg);
        }

        body.long-rest[data-theme="dark"] {
            background-color: var(--long-rest-bg);
        }

        body.long-rest {
            background-color: var(--long-rest-bg);
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 6px 20px var(--shadow-color);
            text-align: center;
            transition: background-color 0.5s ease, box-shadow 0.5s ease;
        }

        .header {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--header-border);
            position: relative;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary-text);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.3rem;
            border-radius: 50%;
            width: 2rem;
            height: 2rem;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background-color: var(--btn-bg);
            color: white;
        }

        .music-play-pause {
            position: absolute;
            top: 0;
            left: 0;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary-text);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.3rem;
            border-radius: 50%;
            width: 2rem;
            height: 2rem;
            transition: all 0.3s;
        }

        .music-play-pause:hover {
            background-color: var(--btn-bg);
            color: white;
        }

        .music-play-pause.playing {
            color: var(--btn-bg);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .status {
            font-size: 1.1rem;
            font-weight: 500;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            display: inline-block;
            margin-top: 0.5rem;
            transition: all 0.3s ease;
        }

        .status.working {
            background-color: var(--working-bg-light);
            color: var(--working-color);
        }

        .status.rest {
            background-color: var(--rest-bg);
            color: var(--rest-color);
        }

        .status.long-rest {
            background-color: var(--long-rest-bg);
            color: var(--long-rest-color);
        }

        .timer {
            font-size: 4.5rem;
            font-weight: 700;
            margin: 1.5rem 0;
            color: var(--text-color);
            position: relative;
            transition: color 0.3s ease;
        }

        .progress-container {
            width: 240px;
            height: 240px;
            margin: 0 auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
            transition: all 0.3s ease;
        }

        .progress-ring circle {
            fill: transparent;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s, stroke 0.3s;
        }

        .progress-bg {
            stroke: var(--stat-bg);
            transition: stroke 0.3s;
        }

        .progress-bar {
            stroke: var(--working-color);
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            transition: stroke-dashoffset 1s linear;
        }

        .progress-bar.rest {
            stroke: var(--rest-color);
        }

        .progress-bar.long-rest {
            stroke: var(--long-rest-color);
        }

        .controls {
            display: flex;
            justify-content: center;
            margin: 1.5rem 0;
            gap: 1rem;
        }

        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: var(--btn-bg);
            color: var(--btn-text);
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: var(--btn-bg);
            color: white;
            padding: 0.8rem 2rem;
        }

        .btn-cancel {
            background: none;
            border: none;
            color: var(--secondary-text);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: absolute;
            top: 1rem;
            right: 1rem;
        }

        .btn-cancel:hover {
            color: var(--text-color);
        }

        .btn-reset-stats {
            background-color: transparent;
            color: var(--secondary-text);
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-reset-stats:hover {
            color: var(--text-color);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-item {
            padding: 0.6rem 1.2rem;
            background-color: var(--stat-bg);
            border-radius: 10px;
            transition: background-color 0.3s;
        }

        .stat-count {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-color);
            transition: color 0.3s;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--secondary-text);
            transition: color 0.3s;
        }

        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .settings-overlay.visible {
            display: block;
            opacity: 1;
        }

        .settings {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 1000;
            background-color: var(--settings-bg);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 8px 24px var(--shadow-color);
            width: 66.66vw;
            max-width: 800px;
            height: 66.66vh;
            max-height: 600px;
            display: none;
            flex-direction: column;
            align-items: center;
            overflow-y: hidden;
            /* 修改为 hidden，禁用滚动条 */
        }

        .settings.visible {
            display: flex;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .settings-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 2rem;
            color: var(--text-color);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            width: 100%;
        }

        .settings-item {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .settings-label {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .settings-input {
            padding: 0.9rem;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1.2rem;
            width: 100%;
            transition: border-color 0.3s, background-color 0.3s, color 0.3s;
        }

        .settings-input:focus {
            outline: none;
            border-color: var(--working-color);
            box-shadow: 0 0 0 2px var(--working-bg-light);
        }

        .settings-buttons {
            display: flex;
            justify-content: center;
            margin-top: 2.5rem;
        }

        .settings-reset {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .btn-save {
            background-color: var(--btn-bg);
            color: white;
            border-radius: 8px;
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .sound-controls {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .test-sound {
            padding: 0.8rem 1.5rem;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.3s;
        }

        .test-sound:hover {
            opacity: 0.9;
        }

        .sound-status {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: var(--secondary-text);
            height: 20px;
        }

        .sound-status.error {
            color: #ff6b6b;
        }

        .sound-status.success {
            color: var(--working-color);
        }

        .settings-toggle {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: none;
            border: none;
            color: var(--working-color);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .settings-toggle:hover {
            color: var(--text-color);
        }

        .music-controls {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--header-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: 100%;
        }

        .volume-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .volume-label {
            min-width: 80px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-color);
        }

        .volume-slider {
            flex-grow: 1;
            height: 6px;
            -webkit-appearance: none;
            background: var(--input-border);
            border-radius: 3px;
            outline: none;
            transition: background 0.3s ease;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--btn-bg);
            box-shadow: 0 1px 3px var(--shadow-color);
        }

        .volume-slider::-webkit-slider-runnable-track {
            background: var(--input-border);
            border-radius: 3px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
            }

            .timer {
                font-size: 3.5rem;
            }

            .progress-container {
                width: 200px;
                height: 200px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .settings {
                padding: 2rem;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .settings-title {
                font-size: 1.5rem;
            }

            .volume-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .volume-slider {
                width: 100%;
            }
        }
    </style>
</head>

<body class="working">
    <div class="settings-overlay"></div>
    <div class="container">
        <div class="header">
            <button id="music-play-pause" class="music-play-pause" title="播放/暂停背景音乐">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path
                        d="M6 13c0 1.105-1.12 2-2.5 2S1 14.105 1 13c0-1.104 1.12-2 2.5-2s2.5.896 2.5 2zm9-2c0 1.105-1.12 2-2.5 2s-2.5-.895-2.5-2 1.12-2 2.5-2 2.5.895 2.5 2z" />
                    <path fill-rule="evenodd" d="M14 11V2h1v9h-1zM6 3v10H5V3h1z" />
                    <path d="M5 2.905a1 1 0 0 1 .9-.995l8-.8a1 1 0 0 1 1.1.995V3L5 4V2.905z" />
                </svg>
            </button>
            <button id="theme-toggle" class="theme-toggle" title="切换暗黑模式">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"
                    id="theme-icon">
                    <path
                        d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.318.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z" />
                </svg>
            </button>
            <h1>番茄时钟</h1>
            <div class="status working">专注工作中</div>
        </div>

        <div class="progress-container">
            <svg class="progress-ring" width="240" height="240">
                <circle class="progress-bg" cx="120" cy="120" r="112" />
                <circle class="progress-bar" cx="120" cy="120" r="112" />
            </svg>
            <div class="timer">50:00</div>
        </div>

        <div class="controls">
            <button id="btn-start" class="btn-primary">开始</button>
            <button id="btn-reset" class="btn-primary">重置</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div id="pomodoro-count" class="stat-count">0</div>
                <div class="stat-label">已完成</div>
            </div>
            <div class="stat-item">
                <div id="cycle-count" class="stat-count">0</div>
                <div class="stat-label">循环</div>
            </div>
            <div class="stat-item">
                <div id="total-pomodoro-count" class="stat-count">0</div>
                <div class="stat-label">总完成</div>
            </div>
        </div>

        <div class="sound-controls">
            <button id="btn-test-sound" class="test-sound">测试铃声</button>
            <div id="sound-status" class="sound-status"></div>
        </div>

        <button id="settings-toggle" class="settings-toggle">设置</button>

        <div class="settings">
            <button id="btn-cancel-settings" class="btn-cancel">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
            <div class="settings-title">设置</div>
            <div class="settings-grid">
                <div class="settings-item">
                    <label class="settings-label">工作时长 (分钟)</label>
                    <input type="number" id="work-time" class="settings-input" min="1" max="180" value="50">
                </div>
                <div class="settings-item">
                    <label class="settings-label">短休息时长 (分钟)</label>
                    <input type="number" id="short-break" class="settings-input" min="1" max="60" value="10">
                </div>
                <div class="settings-item">
                    <label class="settings-label">长休息时长 (分钟)</label>
                    <input type="number" id="long-break" class="settings-input" min="1" max="60" value="30">
                </div>
                <div class="settings-item">
                    <label class="settings-label">长休息间隔 (番茄数)</label>
                    <input type="number" id="pomodoros-per-cycle" class="settings-input" min="1" max="10" value="4">
                </div>
            </div>
            <div class="music-controls">
                <div class="volume-container">
                    <span class="volume-label">背景音乐音量</span>
                    <input type="range" id="volume-slider" min="0" max="100" value="25" class="volume-slider">
                </div>
            </div>
            <div class="settings-buttons">
                <button id="btn-save-settings" class="btn-save">保存</button>
            </div>
            <div class="settings-reset">
                <button id="btn-reset-stats" class="btn-reset-stats">重置数据</button>
            </div>
        </div>
    </div>

    <audio id="sound-bell" preload="auto"></audio>
    <audio id="background-music" loop preload="auto">
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const body = document.body;
            const statusText = document.querySelector('.status');
            const timerDisplay = document.querySelector('.timer');
            const progressBar = document.querySelector('.progress-bar');
            const startButton = document.getElementById('btn-start');
            const resetButton = document.getElementById('btn-reset');
            const bell = document.getElementById('sound-bell');
            const pomodoroCountDisplay = document.getElementById('pomodoro-count');
            const cycleCountDisplay = document.getElementById('cycle-count');
            const totalPomodoroCountDisplay = document.getElementById('total-pomodoro-count');
            const testSoundButton = document.getElementById('btn-test-sound');
            const soundStatus = document.getElementById('sound-status');
            const themeToggle = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            const settingsToggle = document.getElementById('settings-toggle');
            const settingsPanel = document.querySelector('.settings');
            const settingsOverlay = document.querySelector('.settings-overlay');
            const cancelSettingsButton = document.getElementById('btn-cancel-settings');
            const workTimeInput = document.getElementById('work-time');
            const shortBreakInput = document.getElementById('short-break');
            const longBreakInput = document.getElementById('long-break');
            const pomodorosPerCycleInput = document.getElementById('pomodoros-per-cycle');
            const saveSettingsButton = document.getElementById('btn-save-settings');
            const backgroundMusic = document.getElementById('background-music');
            const musicPlayPause = document.getElementById('music-play-pause');
            const volumeSlider = document.getElementById('volume-slider');
            const resetStatsButton = document.getElementById('btn-reset-stats');

            let settings = loadSettings();
            let stats = loadStats();
            let isRunning = false;
            let isWorking = true;
            const audioCacheConfig = {
                database: 'pomodoro-audio-cache',
                store: 'audio',
                backgroundMusicKey: 'background-music-v1',
                backgroundMusicUrl: 'bgm.mp3'
            };

            const worker = new Worker('pomodoroWorker.js');

            worker.postMessage({
                type: 'init',
                data: {
                    workTime: settings.workTime,
                    shortBreak: settings.shortBreak,
                    longBreak: settings.longBreak,
                    pomodorosPerCycle: settings.pomodorosPerCycle,
                    completedPomodoros: stats.completedPomodoros,
                    completedCycles: stats.completedCycles,
                    totalCompletedPomodoros: stats.totalCompletedPomodoros
                }
            });

            const circle = progressBar;
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = `0`;

            worker.onmessage = function (e) {
                const { type, timeRemaining, isRunning: workerIsRunning, isWorking: workerIsWorking, isLongBreak, completedPomodoros, completedCycles, totalCompletedPomodoros, wasWorking, timestamp } = e.data;
                if (type === 'update') {
                    isRunning = workerIsRunning;
                    isWorking = workerIsWorking;
                    updateDisplay(timeRemaining, isRunning, isWorking, isLongBreak, completedPomodoros, completedCycles, totalCompletedPomodoros);
                } else if (type === 'finished') {
                    isRunning = workerIsRunning;
                    isWorking = workerIsWorking;
                    playSound(wasWorking); // 传递 wasWorking 给 playSound
                } else if (type === 'saveStats') {
                    const newStats = { completedPomodoros, completedCycles, totalCompletedPomodoros };
                    saveStats(newStats);
                    // 每次保存数据时更新时间戳，确保我们能追踪上次数据更新的时间
                    localStorage.setItem('pomodoroResetTimestamp', new Date().toISOString());
                    stats = newStats;
                } else if (type === 'statsReset') {
                    const resetStats = { completedPomodoros: 0, completedCycles: 0, totalCompletedPomodoros: 0 };
                    saveStats(resetStats);
                    stats = resetStats;
                }
            };

            function debounce(func, wait) {
                let timeout;
                return function (...args) {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), wait);
                };
            }

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            function updateDisplay(timeRemaining, isRunning, isWorking, isLongBreak, completedPomodoros, completedCycles, totalCompletedPomodoros) {
                timerDisplay.textContent = formatTime(timeRemaining);
                const totalTime = isWorking ? settings.workTime * 60 : (isLongBreak ? settings.longBreak * 60 : settings.shortBreak * 60);
                const percent = (timeRemaining / totalTime) * 100;
                const dashOffset = circumference * (percent / 100) - circumference;
                progressBar.style.strokeDasharray = `${circumference} ${circumference}`;
                progressBar.style.strokeDashoffset = dashOffset;

                if (isWorking) {
                    body.className = 'working';
                    if (!isRunning) body.classList.add('paused');
                    else body.classList.remove('paused');
                    statusText.className = 'status working';
                    statusText.textContent = '专注工作中';
                } else if (isLongBreak) {
                    body.className = 'long-rest';
                    body.classList.remove('paused');
                    statusText.className = 'status long-rest';
                    statusText.textContent = '长休息中';
                } else {
                    body.className = 'rest';
                    body.classList.remove('paused');
                    statusText.className = 'status rest';
                    statusText.textContent = '休息中';
                }
                progressBar.className = `progress-bar ${isWorking ? 'working' : (isLongBreak ? 'long-rest' : 'rest')}`;
                startButton.textContent = isRunning ? '暂停' : '开始';
                pomodoroCountDisplay.textContent = completedPomodoros;
                cycleCountDisplay.textContent = completedCycles;
                totalPomodoroCountDisplay.textContent = totalCompletedPomodoros;
            }

            function playSound(wasWorking) {
                const wasPlaying = !backgroundMusic.paused;
                const soundFile = wasWorking ? 'Summer.mp3' : 'rest1.mp3';
                const resumeBackgroundMusic = () => {
                    if (wasPlaying && backgroundMusic.paused) {
                        backgroundMusic.play().catch(err => console.error('恢复背景音乐失败:', err));
                    }
                };
                if (wasPlaying) backgroundMusic.pause();
                bell.src = soundFile;
                bell.currentTime = 0;
                bell.loop = false;
                bell.onended = resumeBackgroundMusic;
                bell.play().then(() => {
                    console.log(`${soundFile} 播放成功`);
                    if (Notification.permission === "granted") {
                        new Notification("番茄时钟提醒", {
                            body: wasWorking ? "工作时间结束！请开始休息。" : "休息时间结束！请开始工作。",
                            icon: "icon.png",
                            requireInteraction: true
                        });
                    } else if (Notification.permission !== "denied") {
                        Notification.requestPermission().then(permission => {
                            if (permission === "granted") {
                                new Notification("番茄时钟提醒", {
                                    body: wasWorking ? "工作时间结束！请开始休息。" : "休息时间结束！请开始工作。",
                                    icon: "icon.png",
                                    requireInteraction: true
                                });
                            }
                        });
                    }
                }).catch(e => {
                    console.error('铃声播放失败:', e);
                    soundStatus.textContent = "铃声播放失败";
                    soundStatus.className = "sound-status error";
                    resumeBackgroundMusic();
                });
            }

            startButton.addEventListener('click', debounce(() => {
                worker.postMessage({ type: isRunning ? 'pause' : 'start' });
            }, 100));

            resetButton.addEventListener('click', debounce(() => {
                worker.postMessage({ type: 'reset' });
            }, 100));

            function saveSettings() {
                const newSettings = {
                    workTime: parseInt(workTimeInput.value),
                    shortBreak: parseInt(shortBreakInput.value),
                    longBreak: parseInt(longBreakInput.value),
                    pomodorosPerCycle: parseInt(pomodorosPerCycleInput.value)
                };

                if (newSettings.workTime < 1 || newSettings.workTime > 180 ||
                    newSettings.shortBreak < 1 || newSettings.shortBreak > 60 ||
                    newSettings.longBreak < 1 || newSettings.longBreak > 60 ||
                    newSettings.pomodorosPerCycle < 1 || newSettings.pomodorosPerCycle > 10) {
                    alert("请输入有效的设置值！");
                    return;
                }

                localStorage.setItem('pomodoroSettings', JSON.stringify(newSettings));
                settings = newSettings;
                worker.postMessage({ type: 'updateSettings', data: newSettings });
                closeSettings();
            }

            function openSettings() {
                document.body.classList.add('no-scroll');
                settingsOverlay.style.display = 'block';
                settingsPanel.style.display = 'flex';
                setTimeout(() => {
                    settingsOverlay.classList.add('visible');
                    settingsPanel.classList.add('visible');
                }, 10);
            }

            function closeSettings() {
                document.body.classList.remove('no-scroll');
                settingsPanel.classList.remove('visible');
                settingsOverlay.classList.remove('visible');
                setTimeout(() => {
                    settingsPanel.style.display = 'none';
                    settingsOverlay.style.display = 'none';
                }, 300);
            }

            function loadSettings() {
                const defaultSettings = { workTime: 50, shortBreak: 10, longBreak: 30, pomodorosPerCycle: 4 };
                const savedSettings = localStorage.getItem('pomodoroSettings');
                return savedSettings ? JSON.parse(savedSettings) : defaultSettings;
            }

            function loadStats() {
                const defaultStats = { completedPomodoros: 0, completedCycles: 0, totalCompletedPomodoros: 0 };
                const savedStats = localStorage.getItem('pomodoroStats');
                const savedTimestamp = localStorage.getItem('pomodoroResetTimestamp');

                // 如果没有保存的数据，直接返回默认值并创建时间戳
                if (!savedStats || !savedTimestamp) {
                    localStorage.setItem('pomodoroResetTimestamp', new Date().toISOString());
                    return defaultStats;
                }

                // 计算今天的重置时间点（早上5点）
                const now = new Date();
                const today5am = new Date(now);
                today5am.setHours(5, 0, 0, 0);

                // 计算上次重置的时间
                const lastReset = new Date(savedTimestamp);

                // 检查是否需要重置
                // 如果现在的时间 >= 今天的5点，且上次重置时间 < 今天的5点，则需要重置
                if (now >= today5am && lastReset < today5am) {
                    // 今天5点后首次加载，需要重置数据
                    const newStats = { ...defaultStats };
                    localStorage.setItem('pomodoroStats', JSON.stringify(newStats));
                    localStorage.setItem('pomodoroResetTimestamp', now.toISOString());
                    console.log('每日重置已执行:', now);
                    return newStats;
                }

                // 不需要重置，返回保存的数据
                return JSON.parse(savedStats);
            }

            function saveStats(stats) {
                localStorage.setItem('pomodoroStats', JSON.stringify(stats));
            }

            testSoundButton.addEventListener('click', debounce(() => {
                playSound(true);
                soundStatus.textContent = "铃声测试成功";
                soundStatus.className = "sound-status success";
                setTimeout(() => {
                    soundStatus.textContent = "";
                    soundStatus.className = "sound-status";
                }, 2000);
            }, 100));

            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('pomodoroTheme', newTheme);
                themeIcon.innerHTML = newTheme === 'dark' ?
                    '<path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.318.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>' :
                    '<path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"/>';
            });

            settingsToggle.addEventListener('click', openSettings);

            cancelSettingsButton.addEventListener('click', closeSettings);

            settingsOverlay.addEventListener('click', (e) => {
                if (e.target === settingsOverlay) {
                    closeSettings();
                }
            });

            saveSettingsButton.addEventListener('click', saveSettings);

            resetStatsButton.addEventListener('click', () => {
                if (confirm('确定要重置数据吗？此操作不可撤销。')) {
                    worker.postMessage({ type: 'resetAll' });
                    localStorage.removeItem('pomodoroStats');
                    localStorage.removeItem('pomodoroResetTimestamp');
                }
            });

            const savedTheme = localStorage.getItem('pomodoroTheme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (savedTheme === 'dark') {
                themeIcon.innerHTML = '<path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.318.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>';
            }

            workTimeInput.value = settings.workTime;
            shortBreakInput.value = settings.shortBreak;
            longBreakInput.value = settings.longBreak;
            pomodorosPerCycleInput.value = settings.pomodorosPerCycle;

            updateDisplay(settings.workTime * 60, false, true, false, stats.completedPomodoros, stats.completedCycles, stats.totalCompletedPomodoros);

            musicPlayPause.addEventListener('click', () => {
                if (backgroundMusic.paused) {
                    backgroundMusic.play().then(() => musicPlayPause.classList.add('playing')).catch(err => console.error('播放背景音乐失败:', err));
                } else {
                    backgroundMusic.pause();
                    musicPlayPause.classList.remove('playing');
                }
            });

            volumeSlider.addEventListener('input', () => {
                backgroundMusic.volume = volumeSlider.value / 100;
                localStorage.setItem('backgroundMusicVolume', volumeSlider.value);
            });

            function loadMusicSettings() {
                const savedVolume = localStorage.getItem('backgroundMusicVolume');
                if (savedVolume !== null) {
                    volumeSlider.value = savedVolume;
                    backgroundMusic.volume = savedVolume / 100;
                } else {
                    backgroundMusic.volume = 0.25;
                    volumeSlider.value = 25;
                }
            }

            function openAudioCache() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(audioCacheConfig.database, 1);

                    request.onupgradeneeded = () => {
                        const database = request.result;
                        if (!database.objectStoreNames.contains(audioCacheConfig.store)) {
                            database.createObjectStore(audioCacheConfig.store);
                        }
                    };
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            function readCachedAudio(key) {
                return openAudioCache().then(database => new Promise((resolve, reject) => {
                    const transaction = database.transaction(audioCacheConfig.store, 'readonly');
                    const request = transaction.objectStore(audioCacheConfig.store).get(key);

                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                    transaction.oncomplete = () => database.close();
                }));
            }

            function writeCachedAudio(key, blob) {
                return openAudioCache().then(database => new Promise((resolve, reject) => {
                    const transaction = database.transaction(audioCacheConfig.store, 'readwrite');
                    transaction.objectStore(audioCacheConfig.store).put(blob, key);
                    transaction.oncomplete = () => {
                        database.close();
                        resolve();
                    };
                    transaction.onerror = () => {
                        database.close();
                        reject(transaction.error);
                    };
                }));
            }

            function setBackgroundMusicSource(source) {
                if (backgroundMusic.dataset.objectUrl) {
                    URL.revokeObjectURL(backgroundMusic.dataset.objectUrl);
                }

                if (source instanceof Blob) {
                    const objectUrl = URL.createObjectURL(source);
                    backgroundMusic.dataset.objectUrl = objectUrl;
                    backgroundMusic.src = objectUrl;
                } else {
                    delete backgroundMusic.dataset.objectUrl;
                    backgroundMusic.src = source;
                }
                backgroundMusic.load();
            }

            async function loadBackgroundMusic() {
                try {
                    const cachedBlob = await readCachedAudio(audioCacheConfig.backgroundMusicKey);
                    if (cachedBlob && cachedBlob.size > 0) {
                        setBackgroundMusicSource(cachedBlob);
                        return;
                    }

                    const response = await fetch(audioCacheConfig.backgroundMusicUrl, { cache: 'force-cache' });
                    if (!response.ok && response.status !== 0) {
                        throw new Error(`背景音乐请求失败：${response.status}`);
                    }

                    const blob = await response.blob();
                    if (!blob.size) {
                        throw new Error('背景音乐文件为空');
                    }

                    setBackgroundMusicSource(blob);
                    await writeCachedAudio(audioCacheConfig.backgroundMusicKey, blob);
                } catch (error) {
                    console.warn('背景音乐本地缓存不可用，已回退到浏览器缓存：', error);
                    setBackgroundMusicSource(audioCacheConfig.backgroundMusicUrl);
                }
            }

            loadMusicSettings();
            loadBackgroundMusic();

            window.addEventListener('beforeunload', () => {
                if (backgroundMusic.dataset.objectUrl) {
                    URL.revokeObjectURL(backgroundMusic.dataset.objectUrl);
                }
            });
        });
    </script>
